[project]
name = "ppo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "fabio", email = "fabio.cescon@outlook.it" }
]
requires-python = ">=3.12"
dependencies = [
    "chess>=1.11.2",
    "cloudpickle>=3.1.2",
    "gym-super-mario-bros>=7.4.0",
    "gymnasium[atari,classic-control]>=1.4.0",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "torch>=2.15.0",
    "ziglang>=0.17.0",
]

[project.scripts]
ppo = "ppo:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
